name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - name: Verify installation and command aliases
        run: |
          dest=$(mktemp -d)
          PREFIX="$dest" bash install.sh
          "$dest/bps" --help
          "$dest/bird-peer-summary" --version
          PREFIX="$dest" TARGET_NAME=bird-peer-summary bash install.sh
          test ! -L "$dest/bird-peer-summary"
          "$dest/bird-peer-summary" --help
